[project]
name = "phone-joystick"
version = "0.3.2"
description = "Use your phone as a joystick for games on your Mac or Windows PC"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "aiohttp>=3.10",
    "pyobjc-framework-Quartz>=11; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=11; sys_platform == 'darwin'",
    "qrcode>=8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-aiohttp>=1.1",
    "playwright==1.63.0",
    "pyinstaller>=6.22",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
