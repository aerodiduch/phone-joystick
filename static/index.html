<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Joystick">
  <meta name="theme-color" content="#101216">
  <title>Joystick</title>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="bar">
    <div class="status" id="status" data-state="off">
      <span class="dot"></span><span class="status-text" id="status-text"></span>
    </div>
    <div class="layouts" id="layouts" role="radiogroup"></div>
    <div class="mode" id="mode" role="radiogroup">
      <button role="radio" data-mode="dpad"><span class="mode-icon">✚</span><span class="mode-text" data-text="dpad"></span></button>
      <button role="radio" data-mode="analog"><span class="mode-icon">◉</span><span class="mode-text" data-text="analog"></span></button>
    </div>
  </header>
  <main class="pad">
    <section class="stick-zone" id="stick-zone" hidden><div class="stick-hint"></div></section>
    <section class="dpad-zone" id="dpad-zone">
      <div class="dpad" id="dpad">
        <span class="arm up" data-dir="up">▲</span>
        <span class="arm down" data-dir="down">▼</span>
        <span class="arm left" data-dir="left">◀</span>
        <span class="arm right" data-dir="right">▶</span>
      </div>
    </section>
    <section class="buttons">
      <div class="face">
        <button class="btn y" data-control="y"><span class="name">Y</span><span class="key"></span></button>
        <button class="btn x" data-control="x"><span class="name">X</span><span class="key"></span></button>
        <button class="btn b" data-control="b"><span class="name">B</span><span class="key"></span></button>
        <button class="btn a" data-control="a"><span class="name">A</span><span class="key"></span></button>
      </div>
    </section>
    <button class="shoulder l1" data-control="l1" hidden><span class="name">L1</span><span class="key"></span></button>
    <button class="shoulder r1" data-control="r1" hidden><span class="name">R1</span><span class="key"></span></button>
    <div class="system">
      <button class="pill" data-control="select"><span class="name">Select</span><span class="key"></span></button>
      <button class="pill" data-control="start"><span class="name">Start</span><span class="key"></span></button>
    </div>
  </main>
  <div class="sheet" id="sheet" hidden><div class="sheet-list" id="sheet-list" role="radiogroup"></div></div>
  <script src="/static/vendor/nipplejs-1.0.4.min.js"></script>
  <script src="/static/common.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
